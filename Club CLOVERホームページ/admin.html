<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club CLOVER | Cast Admin</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="admin-page" data-active-admin="pickup">
    <header class="admin-header">
      <a class="brand" href="index.html">
        <span class="brand-logo"><img src="assets/images/logo-clover-main.png" alt=""></span>
      </a>
      <div class="admin-actions">
        <button class="button button-ghost" type="button" id="sampleResetButton">初期データ</button>
        <a class="button button-ghost" href="schedule.html">出勤入力</a>
        <a class="button button-ghost" href="profile.html">プロフィール編集</a>
        <button class="button button-ghost" type="button" data-logout>ログアウト</button>
        <a class="button button-primary" href="index.html">トップ確認</a>
      </div>
    </header>

    <main class="admin-shell">
      <nav class="admin-menu site-admin" aria-label="管理メニュー">
        <button class="button button-ghost is-active" type="button" data-admin-tab="pickup">NEWS投稿</button>
        <button class="button button-ghost" type="button" data-admin-tab="top">トップ編集</button>
        <button class="button button-ghost" type="button" data-admin-tab="shop">店舗情報</button>
        <button class="button button-ghost" type="button" data-admin-tab="prices">料金</button>
        <button class="button button-ghost" type="button" data-admin-tab="recruit">求人情報</button>
        <button class="button button-ghost" type="button" data-admin-tab="sns">SNS</button>
        <button class="button button-ghost" type="button" data-admin-tab="cast">キャスト登録</button>
        <a class="button button-ghost" href="schedule.html">出勤入力</a>
      </nav>

      <section class="admin-editor site-admin" aria-labelledby="site-editor-title">
        <div class="section-heading compact">
          <p class="section-kicker">SITE ADMIN</p>
          <h1 id="site-editor-title">サイト内容編集</h1>
        </div>

        <section class="blog-admin pickup-admin" data-admin-view="pickup" aria-labelledby="pickup-admin">
          <div class="section-heading compact">
            <p class="section-kicker">PICK UP NEWS</p>
            <h2 id="pickup-admin">ピックアップ投稿</h2>
          </div>
          <div class="form-grid">
            <label>
              <span>投稿日</span>
              <input id="pickupDate" type="date">
            </label>
            <label>
              <span>タイトル</span>
              <input id="pickupTitle" type="text" maxlength="60" placeholder="例: 本日のピックアップ">
            </label>
          </div>
          <label>
            <span>内容</span>
            <textarea id="pickupText" rows="3" maxlength="180" placeholder="トップページNEWSに表示する内容"></textarea>
          </label>
          <input id="pickupImageData" type="hidden">
          <div class="photo-editor">
            <div class="photo-preview pickup-preview" id="pickupImagePreview" aria-label="NEWS画像プレビュー">
              <span>IMAGE</span>
            </div>
            <div class="photo-tools">
              <label class="file-button">
                <input id="pickupImage" type="file" accept="image/*">
                <span>画像を選択</span>
              </label>
              <button class="button button-ghost" type="button" id="clearPickupImageButton">画像を外す</button>
            </div>
          </div>
          <div class="form-actions">
            <button class="button button-primary" type="button" id="addPickupButton">NEWSを投稿</button>
            <p class="save-status" id="pickupStatus" aria-live="polite"></p>
          </div>
          <div id="pickupNewsList" class="blog-admin-list"></div>
        </section>

        <form id="siteForm" class="cast-form site-form">
          <section class="blog-admin" data-admin-section="top" aria-labelledby="top-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">TOP</p>
              <h2 id="top-admin-title">トップ編集</h2>
            </div>
            <label>
              <span>トップ小見出し</span>
              <input id="settingHeroEyebrow" type="text" maxlength="60">
            </label>
            <label>
              <span>トップ紹介文</span>
              <textarea id="settingHeroCopy" rows="3" maxlength="180"></textarea>
            </label>
            <label>
              <span>在籍一覧への紹介文</span>
              <textarea id="settingCastLinkText" rows="3" maxlength="180"></textarea>
            </label>
          </section>

          <section class="blog-admin" data-admin-section="prices" aria-labelledby="price-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">SYSTEM</p>
              <h2 id="price-admin-title">料金システム</h2>
            </div>
            <div id="priceAdminList" class="blog-admin-list price-admin-list"></div>
            <div class="form-actions align-left">
              <button class="button button-ghost" type="button" id="addPriceButton">料金項目を追加</button>
            </div>
            <label>
              <span>店舗紹介タイトル</span>
              <input id="settingSystemTitle" type="text" maxlength="40">
            </label>
            <label>
              <span>店舗紹介文</span>
              <textarea id="settingSystemText" rows="3" maxlength="180"></textarea>
            </label>
          </section>

          <section class="blog-admin" data-admin-section="recruit" aria-labelledby="recruit-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">RECRUIT</p>
              <h2 id="recruit-admin-title">求人情報</h2>
            </div>
            <label>
              <span>求人トップ文</span>
              <textarea id="settingRecruitHeroText" rows="3" maxlength="220"></textarea>
            </label>
            <div class="form-grid">
              <label><span>応募先メール</span><input id="settingRecruitEmail" type="text" placeholder="recruit@example.com"></label>
              <label><span>キャスト 勤務時間</span><input id="settingRecruitCastTime" type="text"></label>
              <label><span>キャスト 給与</span><input id="settingRecruitCastPay" type="text"></label>
              <label><span>キャスト 待遇</span><input id="settingRecruitCastBenefit" type="text"></label>
              <label><span>黒服 勤務時間</span><input id="settingRecruitStaffTime" type="text"></label>
              <label><span>黒服 給与</span><input id="settingRecruitStaffPay" type="text"></label>
              <label><span>黒服 仕事内容</span><input id="settingRecruitStaffWork" type="text"></label>
            </div>
            <label>
              <span>求人注意書き</span>
              <textarea id="settingRecruitNote" rows="3" maxlength="220"></textarea>
            </label>
          </section>

          <section class="blog-admin" data-admin-section="shop" aria-labelledby="shop-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">SHOP</p>
              <h2 id="shop-admin-title">店舗情報・予約</h2>
            </div>
            <div class="form-grid">
              <label><span>店名</span><input id="settingShopName" type="text"></label>
              <label><span>エリア</span><input id="settingArea" type="text"></label>
              <label><span>営業時間</span><input id="settingOpenHours" type="text"></label>
              <label><span>定休日</span><input id="settingHoliday" type="text"></label>
              <label><span>予約メール</span><input id="settingReservationEmail" type="text" placeholder="reservation@example.com"></label>
              <label><span>公式LINE URL</span><input id="settingLineUrl" type="text"></label>
            </div>
            <label>
              <span>予約案内文</span>
              <textarea id="settingReservationText" rows="3" maxlength="180"></textarea>
            </label>
          </section>

          <section class="blog-admin" data-admin-section="sns" aria-labelledby="sns-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">SNS</p>
              <h2 id="sns-admin-title">SNSリンク</h2>
            </div>
            <div class="form-grid">
              <label><span>X URL</span><input id="settingSocialX" type="text"></label>
              <label><span>Instagram URL</span><input id="settingSocialInstagram" type="text"></label>
              <label><span>TikTok URL</span><input id="settingSocialTikTok" type="text"></label>
              <label><span>公式LINE URL</span><input id="settingSocialLine" type="text"></label>
            </div>
          </section>

          <div class="form-actions">
            <button class="button button-primary" type="submit">サイト内容を保存</button>
          </div>
          <p class="save-status" id="siteSaveStatus" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-editor" data-admin-view="cast" aria-labelledby="editor-title">
        <div class="section-heading compact">
          <p class="section-kicker">CAST ADMIN</p>
          <h1 id="editor-title">キャスト編集</h1>
        </div>

        <form id="castForm" class="cast-form">
          <input type="hidden" id="castId">
          <input type="hidden" id="photoData">

          <div class="form-grid">
            <label>
              <span>名前</span>
              <input id="castName" name="name" type="text" required maxlength="24" placeholder="例: RIN">
            </label>
            <label>
              <span>かな</span>
              <input id="castKana" name="kana" type="text" maxlength="24" placeholder="例: りん">
            </label>
            <label>
              <span>肩書き</span>
              <input id="castTitle" name="title" type="text" maxlength="40" placeholder="例: Elegant Queen">
            </label>
            <label>
              <span>表示順</span>
              <input id="castOrder" name="order" type="number" min="1" max="99" value="1">
            </label>
          </div>

          <div class="form-grid profile-meta-grid">
            <label>
              <span>誕生日</span>
              <input id="castBirthday" name="birthday" type="text" maxlength="30" placeholder="例: 8月8日">
            </label>
            <label>
              <span>年齢</span>
              <input id="castAge" name="age" type="text" maxlength="12" placeholder="例: 24歳">
            </label>
            <label>
              <span>身長</span>
              <input id="castHeight" name="height" type="text" maxlength="12" placeholder="例: 160cm">
            </label>
            <label>
              <span>血液型</span>
              <select id="castBloodType" name="bloodType">
                <option value="">未設定</option>
                <option value="A型">A型</option>
                <option value="B型">B型</option>
                <option value="O型">O型</option>
                <option value="AB型">AB型</option>
                <option value="秘密">秘密</option>
              </select>
            </label>
          </div>

          <section class="blog-admin" aria-labelledby="cast-sns-title">
            <div class="section-heading compact">
              <p class="section-kicker">SOCIAL</p>
              <h2 id="cast-sns-title">SNS連携</h2>
            </div>
            <div class="form-grid">
              <label><span>X URL</span><input id="castSocialX" type="text" placeholder="https://x.com/..."></label>
              <label><span>Instagram URL</span><input id="castSocialInstagram" type="text" placeholder="https://www.instagram.com/..."></label>
              <label><span>TikTok URL</span><input id="castSocialTikTok" type="text" placeholder="https://www.tiktok.com/@..."></label>
              <label><span>LINE URL</span><input id="castSocialLine" type="text" placeholder="https://line.me/..."></label>
            </div>
          </section>

          <section class="blog-admin" aria-labelledby="cast-qa-title">
            <div class="section-heading compact">
              <p class="section-kicker">Q&A</p>
              <h2 id="cast-qa-title">Q&A</h2>
            </div>
            <label>
              <span>質問</span>
              <input id="qaQuestion" type="text" maxlength="80" placeholder="例: 好きなお酒は？">
            </label>
            <label>
              <span>回答</span>
              <textarea id="qaAnswer" rows="3" maxlength="240" placeholder="例: シャンパンが好きです"></textarea>
            </label>
            <div class="form-actions">
              <button class="button button-ghost" type="button" id="addQaButton">Q&Aを追加</button>
            </div>
            <div id="qaAdminList" class="blog-admin-list qa-admin-list"></div>
          </section>

          <label>
            <span>ポケパラURL</span>
            <input id="pokepalaUrl" name="pokepalaUrl" type="text" placeholder="https://www.pokepara.jp/...">
          </label>

          <section class="blog-admin" aria-labelledby="blog-admin-title">
            <div class="section-heading compact">
              <p class="section-kicker">BLOG LINK</p>
              <h2 id="blog-admin-title">ブログ投稿</h2>
            </div>
            <div class="form-grid">
              <label>
                <span>投稿日</span>
                <input id="blogDate" type="date">
              </label>
              <label>
                <span>ブログタイトル</span>
                <input id="blogTitle" type="text" maxlength="60" placeholder="例: 今日も出勤です">
              </label>
            </div>
            <label>
              <span>ブログURL</span>
              <input id="blogUrl" type="text" placeholder="ポケパラのブログURL">
            </label>
            <div class="form-actions">
              <button class="button button-ghost" type="button" id="addBlogButton">ブログを追加</button>
            </div>
            <div id="blogAdminList" class="blog-admin-list"></div>
          </section>

          <div class="photo-editor">
            <div class="photo-preview" id="photoPreview" aria-label="写真プレビュー">
              <span>PHOTO</span>
            </div>
            <div class="photo-tools">
              <label class="file-button">
                <input id="castPhoto" name="photo" type="file" accept="image/*">
                <span>写真を選択</span>
              </label>
              <button class="button button-ghost" type="button" id="clearPhotoButton">写真を外す</button>
            </div>
          </div>


          <label class="toggle-row">
            <input id="castVisible" name="visible" type="checkbox" checked>
            <span>トップページに表示</span>
          </label>

          <div class="form-actions">
            <button class="button button-primary" type="submit">保存</button>
            <button class="button button-ghost" type="button" id="newCastButton">新規登録を開始</button>
            <button class="button danger-button" type="button" id="deleteCastButton">削除</button>
          </div>
          <p class="save-status" id="saveStatus" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-list-section" data-admin-view="cast" aria-labelledby="list-title">
        <div class="section-heading compact">
          <p class="section-kicker">CAST LIST</p>
          <h2 id="list-title">登録キャスト</h2>
        </div>
        <div id="adminCastList" class="admin-cast-list"></div>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/cloud.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
