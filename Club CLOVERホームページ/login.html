<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | Club CLOVER 管理画面</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="admin-page login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <span class="login-logo"><img src="assets/images/logo-clover-main.png" alt="Club CLOVER"></span>
        <div class="section-heading compact">
          <p class="section-kicker">MANAGER LOGIN</p>
          <h1 id="login-title">管理画面ログイン</h1>
        </div>
        <form id="loginForm" class="cast-form">
          <label>
            <span>パスワード</span>
            <input id="loginPassword" type="password" autocomplete="current-password" autofocus>
          </label>
          <button class="button button-primary" type="submit">ログイン</button>
          <p class="save-status" id="loginStatus" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
