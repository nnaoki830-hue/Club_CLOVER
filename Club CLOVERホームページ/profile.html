<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プロフィール編集 | Club CLOVER</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html">
        <span class="brand-logo"><img src="assets/images/logo-clover-main.png" alt=""></span>
      </a>
      <div class="admin-actions">
        <a class="button button-ghost" href="admin.html">管理画面</a>
        <a class="button button-ghost" href="cast.html">在籍確認</a>
        <button class="button button-ghost" type="button" data-logout>ログアウト</button>
        <a class="button button-primary" href="index.html">トップ確認</a>
      </div>
    </header>

    <main class="simple-admin-shell">
      <section class="admin-editor">
        <div class="section-heading compact">
          <p class="section-kicker">PROFILE</p>
          <h1>プロフィール編集</h1>
        </div>

        <form id="profileForm" class="cast-form">
          <input type="hidden" id="profilePhotoData">
          <label>
            <span>自分の名前を選択</span>
            <select id="profileCastSelect"></select>
          </label>

          <div class="photo-editor">
            <div class="photo-preview" id="profilePhotoPreview" aria-label="写真プレビュー"></div>
            <div class="photo-tools">
              <label class="file-button">
                <input id="profilePhoto" type="file" accept="image/*">
                <span>写真を選択</span>
              </label>
              <button class="button button-ghost" type="button" id="profileClearPhoto">写真を外す</button>
            </div>
          </div>

          <div class="form-grid">
            <label><span>名前</span><input id="profileName" type="text" maxlength="24"></label>
            <label><span>かな</span><input id="profileKana" type="text" maxlength="24"></label>
            <label><span>肩書き</span><input id="profileTitle" type="text" maxlength="40"></label>
            <label><span>ポケパラURL</span><input id="profilePokepalaUrl" type="text"></label>
          </div>

          <div class="form-grid profile-meta-grid">
            <label><span>誕生日</span><input id="profileBirthday" type="text" maxlength="30" placeholder="例: 8月8日"></label>
            <label><span>年齢</span><input id="profileAge" type="text" maxlength="12" placeholder="例: 24歳"></label>
            <label><span>身長</span><input id="profileHeight" type="text" maxlength="12" placeholder="例: 160cm"></label>
            <label>
              <span>血液型</span>
              <select id="profileBloodType">
                <option value="">未設定</option>
                <option value="A型">A型</option>
                <option value="B型">B型</option>
                <option value="O型">O型</option>
                <option value="AB型">AB型</option>
                <option value="秘密">秘密</option>
              </select>
            </label>
          </div>

          <section class="blog-admin" aria-labelledby="profile-sns-title">
            <div class="section-heading compact">
              <p class="section-kicker">SOCIAL</p>
              <h2 id="profile-sns-title">SNS連携</h2>
            </div>
            <div class="form-grid">
              <label><span>X URL</span><input id="profileSocialX" type="text" placeholder="https://x.com/..."></label>
              <label><span>Instagram URL</span><input id="profileSocialInstagram" type="text" placeholder="https://www.instagram.com/..."></label>
              <label><span>TikTok URL</span><input id="profileSocialTikTok" type="text" placeholder="https://www.tiktok.com/@..."></label>
              <label><span>LINE URL</span><input id="profileSocialLine" type="text" placeholder="https://line.me/..."></label>
            </div>
          </section>

          <section class="blog-admin" aria-labelledby="profile-qa-title">
            <div class="section-heading compact">
              <p class="section-kicker">Q&A</p>
              <h2 id="profile-qa-title">Q&A</h2>
            </div>
            <label><span>質問</span><input id="profileQaQuestion" type="text" maxlength="80" placeholder="例: 好きなお酒は？"></label>
            <label><span>回答</span><textarea id="profileQaAnswer" rows="3" maxlength="240" placeholder="例: シャンパンが好きです"></textarea></label>
            <div class="form-actions">
              <button class="button button-ghost" type="button" id="profileAddQaButton">Q&Aを追加</button>
            </div>
            <div id="profileQaList" class="blog-admin-list qa-admin-list"></div>
          </section>

          <div class="form-actions">
            <button class="button button-primary" type="submit">プロフィールを保存</button>
          </div>
          <p class="save-status" id="profileStatus" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/cloud.js"></script>
    <script src="assets/js/profile.js"></script>
  </body>
</html>
